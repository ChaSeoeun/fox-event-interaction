<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Fox Event Park</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="event-wrap">
        <section class="event-intro">
            <div class="park-stage">
                <img src="./images/event-main-cont.png" class="park-bg" alt="">
                <div class="gate">
                    <img src="./images/event-main-left-door.png" class="gate-door gate-door-left" alt="">
                    <img src="./images/event-main-right-door.png" class="gate-door gate-door-right" alt="">
                </div>
            </div>
            <div class="intro-ui">
                <p class="intro-guide">프레디와 함께 이벤트 파크를 둘러볼까요?</p>
                <button type="button" class="enter-btn">
                    <span>입장하기</span>
                    <span class="enter-btn-arrow">▶</span>
                </button>
                <p class="enter-sub">CLICK TO ENTER</p>
            </div>
        </section>
        <section class="section01">
            <img class="freddy" src="./images/character-f.png" alt="">
        </section>
    </div>
    <div class="intro-flash"></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
